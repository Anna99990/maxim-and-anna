document.addEventListener("DOMContentLoaded", function() {
    // Блокируем скролл при загрузке
    document.body.classList.add('page-scroll-locked');

    var coverBlock = document.querySelector('.uc-envelope-cover');

    if(coverBlock) {
        // Слушаем клик на этапе перехвата
        coverBlock.addEventListener('click', function(e) {
            
            if (coverBlock.dataset.opened) return;
            coverBlock.dataset.opened = "true";

            // --- АВТОЗАПУСК МУЗЫКИ ---
            var audio = document.getElementById("bg-music");
            if(audio) {
                audio.play(); 
                document.body.classList.add("is-playing"); 
            }
            // -------------------------

            // Ждем 2 секунды, пока проиграется анимация конверта
            setTimeout(function() {
                // Плавно скрываем обложку
                coverBlock.style.transition = 'opacity 0.8s ease';
                coverBlock.style.opacity = '0';
                
                // Ждем затухания и полностью удаляем блок
                setTimeout(function() {
                    coverBlock.remove(); 
                    document.body.classList.remove('page-scroll-locked');
                }, 800);
                
            }, 2000); 
        }, true); 
    }
});
